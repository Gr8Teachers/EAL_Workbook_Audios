<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VU23502 Activities</title>
<style>
  :root { --bg:#f7f7f4; --card:#fff; --ink:#1f2328; --muted:#5b636b; --line:#e3e3dc; --accent:#1d6f5f; --accent-soft:#dff1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --card:#1f2226; --ink:#e8e8e3; --muted:#a3a9ae; --line:#30343a; --accent:#5fc2a8; --accent-soft:#1d3a33; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header a { color:var(--accent); text-decoration:none; font-size:.9rem; }
  header h1 { font-size:1.1rem; margin:0; }
  .wrap { flex:1; display:flex; min-height:0; }
  nav { width:300px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--line); background:var(--card); }
  nav ul { list-style:none; margin:0; padding:8px; }
  nav button { width:100%; display:flex; gap:10px; align-items:flex-start; text-align:left; font:inherit; color:var(--ink); background:none; border:0; border-radius:10px; padding:9px 10px; cursor:pointer; }
  nav button:hover { background:var(--bg); }
  nav button.on { background:var(--accent-soft); }
  nav .n { flex-shrink:0; min-width:30px; height:30px; border-radius:8px; background:var(--bg); border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:.9rem; }
  nav button.on .n { background:var(--accent); border-color:var(--accent); color:#fff; }
  nav .t { font-weight:600; }
  nav small { display:block; font-weight:400; color:var(--muted); font-size:.8rem; }
  .stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); }
  .bar select { display:none; flex:1; min-width:0; font:inherit; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .bar .spacer { flex:1; }
  .bar button { font:inherit; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .bar button:disabled { opacity:.4; cursor:default; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
  @media (max-width: 760px) {
    nav { display:none; }
    .bar select { display:block; }
    .bar .spacer, .bar .lbl { display:none; }
  }
  header a { white-space:nowrap; }
  @media (max-width: 760px) { header h1 { font-size:.95rem; } }
</style>
</head>
<body>
<header><a href="../">← Course</a><h1>VU23502 – Give and respond to short, simple spoken information</h1></header>
<div class="wrap">
  <nav aria-label="Activities">
    <ul>
      <li><button data-i="0"><span class="n">19</span><span class="t">At the medical centre – Dr Choi<small>At the Medical Centre - Dr Choi · 0:55</small></span></button></li>
      <li><button data-i="1"><span class="n">20</span><span class="t">Practise exchanging information<small>At the Medical Centre - Dr Jones · 0:50</small></span></button></li>
      <li><button data-i="2"><span class="n">21</span><span class="t">Voicemail message –medical appointment<small>Voicemail message - Appointment · 0:34</small></span></button></li>
      <li><button data-i="3"><span class="n">22</span><span class="t">Voicemail message – homework<small>Voicemail message - Homework · 0:41</small></span></button></li>
      <li><button data-i="4"><span class="n">23</span><span class="t">Voicemail message – vacation<small>Voicemail message - Vacation · 0:31</small></span></button></li>
      <li><button data-i="5"><span class="n">24</span><span class="t">Voicemail message – weather<small>Voicemail message - Weather · 0:37</small></span></button></li>
      <li><button data-i="6"><span class="n">28</span><span class="t">Washing machine instructions<small>Voicemail message - Washing machine instructions · 0:44</small></span></button></li>
      <li><button data-i="7"><span class="n">29</span><span class="t">Announcement<small>Announcement · 0:46</small></span></button></li>
      <li><button data-i="8"><span class="n">32</span><span class="t">Spoken information 1<small>Voicemail message - Moving house 1 · 0:35</small></span></button></li>
      <li><button data-i="9"><span class="n">33</span><span class="t">Practise giving spoken information 1<small>Voicemail message - Moving house 1 · 0:35</small></span></button></li>
      <li><button data-i="10"><span class="n">34</span><span class="t">Spoken information 2<small>Voicemail message - Moving house 2 · 0:36</small></span></button></li>
      <li><button data-i="11"><span class="n">35</span><span class="t">Practise giving spoken information 2<small>Voicemail message - Moving house 2 · 0:36</small></span></button></li>
    </ul>
  </nav>
  <section class="stage">
    <div class="bar">
      <select aria-label="Choose an activity">
      <option value="0">Activity 19: At the medical centre – Dr Choi</option>
      <option value="1">Activity 20: Practise exchanging information</option>
      <option value="2">Activity 21: Voicemail message –medical appointment</option>
      <option value="3">Activity 22: Voicemail message – homework</option>
      <option value="4">Activity 23: Voicemail message – vacation</option>
      <option value="5">Activity 24: Voicemail message – weather</option>
      <option value="6">Activity 28: Washing machine instructions</option>
      <option value="7">Activity 29: Announcement</option>
      <option value="8">Activity 32: Spoken information 1</option>
      <option value="9">Activity 33: Practise giving spoken information 1</option>
      <option value="10">Activity 34: Spoken information 2</option>
      <option value="11">Activity 35: Practise giving spoken information 2</option>
      </select>
      <span class="spacer"></span>
      <button id="prev" aria-label="Previous activity">←<span class="lbl"> Previous</span></button>
      <button id="next" aria-label="Next activity"><span class="lbl">Next </span>→</button>
    </div>
    <iframe title="Activity" src="activities/activity-19.html"></iframe>
  </section>
</div>
<script>
  var D = [{"n": 19, "page": "activities/activity-19.html"}, {"n": 20, "page": "activities/activity-20.html"}, {"n": 21, "page": "activities/activity-21.html"}, {"n": 22, "page": "activities/activity-22.html"}, {"n": 23, "page": "activities/activity-23.html"}, {"n": 24, "page": "activities/activity-24.html"}, {"n": 28, "page": "activities/activity-28.html"}, {"n": 29, "page": "activities/activity-29.html"}, {"n": 32, "page": "activities/activity-32.html"}, {"n": 33, "page": "activities/activity-33.html"}, {"n": 34, "page": "activities/activity-34.html"}, {"n": 35, "page": "activities/activity-35.html"}];
  var frame = document.querySelector('iframe'), sel = document.querySelector('select'),
      btns = document.querySelectorAll('nav button'), prev = document.getElementById('prev'), next = document.getElementById('next'), cur = -1;
  function show(i, push) {
    if (i < 0 || i >= D.length) return;
    if (i !== cur) frame.src = D[i].page;
    cur = i;
    btns.forEach(function (b, k) { b.classList.toggle('on', k === i); });
    sel.value = String(i); prev.disabled = i === 0; next.disabled = i === D.length - 1;
    if (push) history.replaceState(null, '', '#activity-' + D[i].n);
    btns[i].scrollIntoView({ block: 'nearest' });
  }
  btns.forEach(function (b, k) { b.onclick = function () { show(k, true); }; });
  sel.onchange = function () { show(+sel.value, true); };
  prev.onclick = function () { show(cur - 1, true); };
  next.onclick = function () { show(cur + 1, true); };
  var m = location.hash.match(/activity-(\d+)/), start = 0;
  if (m) D.forEach(function (d, k) { if (String(d.n) === m[1]) start = k; });
  show(start, false);
</script>
</body>
</html>
