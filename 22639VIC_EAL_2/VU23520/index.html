<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VU23520 Activities</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  :root { --bg:#f7f7f4; --card:#fff; --ink:#1f2328; --muted:#5b636b; --line:#e3e3dc; --accent:#1d6f5f; --accent-soft:#dff1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --card:#1f2226; --ink:#e8e8e3; --muted:#a3a9ae; --line:#30343a; --accent:#5fc2a8; --accent-soft:#1d3a33; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 Calibri, Carlito, "Segoe UI", Arial, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header a { color:var(--accent); text-decoration:none; font-size:.9rem; }
  header h1 { font-size:1.1rem; margin:0; }
  .wrap { flex:1; display:flex; min-height:0; }
  nav { width:300px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--line); background:var(--card); }
  nav ul { list-style:none; margin:0; padding:8px; }
  nav button { width:100%; display:flex; gap:10px; align-items:flex-start; text-align:left; font:inherit; color:var(--ink); background:none; border:0; border-radius:10px; padding:9px 10px; cursor:pointer; }
  nav button:hover { background:var(--bg); }
  nav button.on { background:var(--accent-soft); }
  nav .n { flex-shrink:0; min-width:30px; height:30px; border-radius:8px; background:var(--bg); border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:.9rem; }
  nav button.on .n { background:var(--accent); border-color:var(--accent); color:#fff; }
  nav .t { font-weight:600; }
  nav small { display:block; font-weight:400; color:var(--muted); font-size:.8rem; }
  .stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); }
  .bar select { display:none; flex:1; min-width:0; font:inherit; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .bar .spacer { flex:1; }
  .bar button { font:inherit; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .bar button:disabled { opacity:.4; cursor:default; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
  @media (max-width: 760px) {
    nav { display:none; }
    .bar select { display:block; }
    .bar .spacer, .bar .lbl { display:none; }
  }
  header a { white-space:nowrap; }
  @media (max-width: 760px) { header h1 { font-size:.95rem; } }
</style>
</head>
<body>
<header><a href="../">← Course</a><h1>VU23520 – Give and respond to simple spoken information and directions</h1></header>
<div class="wrap">
  <nav aria-label="Activities">
    <ul>
      <li><button data-i="0"><span class="n">3</span><span class="t">Weather<small>Weather · 1:11</small></span></button></li>
      <li><button data-i="1"><span class="n">4</span><span class="t">Making an enquiry at TAFE<small>Making an enquiry at TAFE · 1:30</small></span></button></li>

      <li><button data-i="5"><span class="n">11</span><span class="t">Single-use plastics in Australia<small>Single-use  plastics · 4:16</small></span></button></li>
      <li><button data-i="6"><span class="n">12</span><span class="t">Who is the audience?<small>Who is the audience? · 1:09</small></span></button></li>
      <li><button data-i="7"><span class="n">13</span><span class="t">Tasmania presentation 1<small>Tasmania 1 · 1:59</small></span></button></li>
      <li><button data-i="8"><span class="n">14</span><span class="t">Tasmania presentation 2<small>Tasmania 2 · 1:32</small></span></button></li>
      <li><button data-i="9"><span class="n">15</span><span class="t">Australia<small>Australia · 1:10</small></span></button></li>
      <li><button data-i="10"><span class="n">17</span><span class="t">States and territories of Australia<small>States and territories · 1:41</small></span></button></li>
      <li><button data-i="11"><span class="n">19</span><span class="t">Pronunciation<small>Interview with an environmentalist · 2:11</small></span></button></li>
      <li><button data-i="12"><span class="n">20</span><span class="t">An English school<small>An English school · 2:07</small></span></button></li>
      <li><button data-i="13"><span class="n">21</span><span class="t">Parts of a presentation<small>An English school, Tasmania 2 · 2:07, 1:32</small></span></button></li>
      <li><button data-i="14"><span class="n">27</span><span class="t">Directions to ANZ Bank<small>ANZ Bank · 1:18</small></span></button></li>
      <li><button data-i="15"><span class="n">30</span><span class="t">Modals in instructions<small>Modals in instructions · 0:36</small></span></button></li>
      <li><button data-i="16"><span class="n">31</span><span class="t">Spoken instructions<small>Spoken instructions · 0:31</small></span></button></li>
    </ul>
  </nav>
  <section class="stage">
    <div class="bar">
      <select aria-label="Choose an activity">
      <option value="0">Activity 3: Weather</option>
      <option value="1">Activity 4: Making an enquiry at TAFE</option>
      <option value="2">Activity 6: Prepositional phrases – Bush fires</option>
      <option value="3">Activity 7: Terrigal</option>
      <option value="4">Activity 10: Interview with an environmentalist</option>
      <option value="5">Activity 11: Single-use plastics in Australia</option>
      <option value="6">Activity 12: Who is the audience?</option>
      <option value="7">Activity 13: Tasmania presentation 1</option>
      <option value="8">Activity 14: Tasmania presentation 2</option>
      <option value="9">Activity 15: Australia</option>
      <option value="10">Activity 17: States and territories of Australia</option>
      <option value="11">Activity 19: Pronunciation</option>
      <option value="12">Activity 20: An English school</option>
      <option value="13">Activity 21: Parts of a presentation</option>
      <option value="14">Activity 27: Directions to ANZ Bank</option>
      <option value="15">Activity 30: Modals in instructions</option>

      </select>
      <span class="spacer"></span>
      <button id="prev" aria-label="Previous activity">←<span class="lbl"> Previous</span></button>
      <button id="next" aria-label="Next activity"><span class="lbl">Next </span>→</button>
    </div>
    <iframe title="Activity" src="activities/activity-3.html"></iframe>

</div>
<script>
  var D = [{"n": 3, "page": "activities/activity-3.html"}, {"n": 4, "page": "activities/activity-4.html"}, {"n": 6, "page": "activities/activity-6.html"}, {"n": 7, "page": "activities/activity-7.html"}, {"n": 10, "page": "activities/activity-10.html"}, {"n": 11, "page": "activities/activity-11.html"}, {"n": 12, "page": "activities/activity-12.html"}, {"n": 13, "page": "activities/activity-13.html"}, {"n": 14, "page": "activities/activity-14.html"}, {"n": 15, "page": "activities/activity-15.html"}, {"n": 17, "page": "activities/activity-17.html"}, {"n": 19, "page": "activities/activity-19.html"}, {"n": 20, "page": "activities/activity-20.html"}, {"n": 21, "page": "activities/activity-21.html"}, {"n": 27, "page": "activities/activity-27.html"}, {"n": 30, "page": "activities/activity-30.html"}, {"n": 31, "page": "activities/activity-31.html"}];
  var frame = document.querySelector('iframe'), sel = document.querySelector('select'),
      btns = document.querySelectorAll('nav button'), prev = document.getElementById('prev'), next = document.getElementById('next'), cur = -1;
  function show(i, push) {
    if (i < 0 || i >= D.length) return;
    if (i !== cur) frame.src = D[i].page;
    cur = i;
    btns.forEach(function (b, k) { b.classList.toggle('on', k === i); });
    sel.value = String(i); prev.disabled = i === 0; next.disabled = i === D.length - 1;
    if (push) history.replaceState(null, '', '#activity-' + D[i].n);
    btns[i].scrollIntoView({ block: 'nearest' });
  }
  btns.forEach(function (b, k) { b.onclick = function () { show(k, true); }; });
  sel.onchange = function () { show(+sel.value, true); };
  prev.onclick = function () { show(cur - 1, true); };
  next.onclick = function () { show(cur + 1, true); };
  var m = location.hash.match(/activity-(\d+)/), start = 0;
  if (m) D.forEach(function (d, k) { if (String(d.n) === m[1]) start = k; });
  show(start, false);
</script>
</body>
</html>
