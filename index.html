<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbook Audio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  :root { --bg:#f7f7f4; --card:#fff; --ink:#1f2328; --muted:#5b636b; --line:#e3e3dc; --accent:#1d6f5f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --card:#1f2226; --ink:#e8e8e3; --muted:#a3a9ae; --line:#30343a; --accent:#5fc2a8; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 Calibri, Carlito, "Segoe UI", Arial, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.6rem; margin:.2rem 0; }
  .sub { color:var(--muted); margin:0 0 1.5rem; }
  ul { list-style:none; padding:0; margin:0; }
  a.unit { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; color:var(--ink); text-decoration:none; font-weight:600; }
  a.unit span { display:block; color:var(--muted); font-weight:400; font-size:.9rem; }
  a.unit:hover { border-color:var(--accent); }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Workbook audio</h1>
  <p class="sub">Choose your course. No login needed.</p>
  <ul>
    <li><a class="unit" href="22636VIC_Initial_EAL/">22636VIC Initial EAL<span></span></a></li>

    <li><a class="unit" href="22639VIC_EAL_2/">22639VIC EAL 2<span></span></a></li>
    <li><a class="unit" href="22640VIC_EAL_3/">22640VIC EAL 3<span></span></a></li>
  </ul>
</main>
</body>
</html>
